    <text x="42" y="216" font-size="58" font-weight="800" letter-spacing="4" fill="#E8E8E8">PHANTOMTAPE</text>
    <text x="42" y="252" font-size="15" letter-spacing="5" fill="#8A8A8A">DIGITAL AUDIO // SOFTWARE // EXPERIMENTS</text>
