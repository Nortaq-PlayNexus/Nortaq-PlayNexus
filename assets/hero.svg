<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="PHANTOMTAPE pirate radio broadcast hero: signal detected, DJ PHANTOMTAPE, digital audio software and experiments, transmission online">
  <defs>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#050505"/>
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B8FF1E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#B8FF1E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="800" height="360" fill="#050505"/>
  <rect width="800" height="360" fill="url(#vig)"/>
  <rect width="800" height="360" fill="url(#scan)"/>
  <rect width="800" height="360" filter="url(#noise)" opacity="0.045"/>

  <!-- corner brackets -->
  <g stroke="#B8FF1E" fill="none" opacity="0.8">
    <path d="M18 38 h52 M18 38 v52" />
    <path d="M782 38 h-52 M782 38 v52" />
    <path d="M18 322 h52 M18 322 v-52" />
    <path d="M782 322 h-52 M782 322 v-52" />
  </g>

  <!-- top-left readout -->
  <text x="42" y="66" font-family="'Cascadia Code','Fira Code',Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8A8A8A">[&#160;</text>
  <text x="58" y="66" font-family="'Cascadia Code','Fira Code',Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#00E5FF">SIGNAL DETECTED&#160;</text>
  <text x="226" y="66" font-family="'Cascadia Code','Fira Code',Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8A8A8A">]</text>

  <!-- wordmark -->
  <g font-family="'Tomorrow','Orbitron','Space Grotesk',Impact,sans-serif">
    <g>
      <text x="42" y="150" font-size="26" letter-spacing="8" fill="#4D4D4D">DJ</text>
      <text x="106" y="150" font-size="13" letter-spacing="2" fill="#1A1A1A" font-family="'Cascadia Code',monospace">//</text>
      <g>
        <text x="42" y="216" font-size="58" font-weight="800" letter-spacing="4" fill="#E8E8E8">PHANTOMTAPE</text>
        <text x="42" y="216" font-size="58" font-weight="800" letter-spacing="4" fill="#B8FF1E" opacity="0.09">
          <animate attributeName="opacity" values="0.09;0;0.09" dur="6s" repeatCount="indefinite"/>
        </text>
        <text x="44" y="214" font-size="58" font-weight="800" letter-spacing="4" fill="#00E5FF" opacity="0">
          <animate attributeName="opacity" values="0;0.55;0" dur="5s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;3 0;0 0;0.5 -1;0 0" dur="3s" repeatCount="indefinite" additive="sum"/>
        </text>
      </g>
      <g>
        <text x="16" y="216" font-size="58" font-weight="800" letter-spacing="4" fill="#B8FF1E" opacity="0">
          <animate attributeName="opacity" values="0;0;0.4;0" dur="7s" repeatCount="indefinite" keyTimes="0;0.65;0.7;0.78"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-1 0;0 0" dur="7s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>
    <text x="42" y="252" font-size="15" letter-spacing="5" fill="#8A8A8A">DIGITAL AUDIO // SOFTWARE // EXPERIMENTS</text>
    <text x="42" y="284" font-size="12" letter-spacing="3" fill="#4D4D4D">[&#160;<tspan fill="#B8FF1E">TRANSMISSION</tspan>&#160;<tspan fill="#4D4D4D">/</tspan>&#160;<tspan fill="#B8FF1E">ONLINE</tspan>&#160;]</text>
  </g>

  <!-- cassette motif right -->
  <g transform="translate(620,110)">
    <rect x="0" y="0" width="140" height="92" rx="8" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="6" y="6" width="128" height="34" rx="5" fill="#111111" stroke="#1A1A1A"/>
    <text x="14" y="26" font-family="'Cascadia Code',monospace" font-size="10" letter-spacing="2" fill="#00E5FF">PHANTOMTAPE</text>
    <text x="14" y="38" font-family="'Cascadia Code',monospace" font-size="8" letter-spacing="1" fill="#4D4D4D">PHNT-001</text>
    <g>
      <circle cx="42" cy="66" r="17" fill="#050505" stroke="#1A1A1A" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0 42 66" to="360 42 66" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="42" cy="66" r="4" fill="#8A8A8A">
        <animateTransform attributeName="transform" type="rotate" from="0 42 66" to="360 42 66" dur="6s" repeatCount="indefinite"/>
      </circle>
      <g opacity="0.25">
        <circle cx="98" cy="66" r="17" fill="#050505" stroke="#1A1A1A" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0 98 66" to="-360 98 66" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="98" cy="66" r="4" fill="#8A8A8A">
          <animateTransform attributeName="transform" type="rotate" from="0 98 66" to="-360 98 66" dur="6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <rect x="66" y="56" width="8" height="20" rx="2" fill="#E8E8E8" opacity="0.08"/>
  </g>

  <!-- waveform lane -->
  <g transform="translate(42,296)">
    <rect x="0" y="8" width="716" height="2" fill="#1A1A1A" opacity="0.6"/>
    <g id="bars">
      <!-- generated bar grid, staggered -->
      <rect id="b1" x="0"   y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;26;2" dur="1.9s" repeatCount="indefinite" begin="0.0s"/></rect>
      <rect id="b2" x="7"   y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;38;2" dur="2.1s" repeatCount="indefinite" begin="0.15s"/></rect>
      <rect id="b3" x="14"  y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;12;2" dur="1.7s" repeatCount="indefinite" begin="0.3s"/></rect>
      <rect id="b4" x="21"  y="8" width="4" height="2" fill="#00E5FF" opacity="0.5"><animate attributeName="height" values="2;44;2" dur="2.3s" repeatCount="indefinite" begin="0.45s"/></rect>
      <rect id="b5" x="28"  y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;30;2" dur="1.8s" repeatCount="indefinite" begin="0.6s"/></rect>
      <rect id="b6" x="35"  y="8" width="4" height="2" fill="#B8FF1E" opacity="0.5"><animate attributeName="height" values="2;8;2" dur="2.0s" repeatCount="indefinite" begin="0.75s"/></rect>
      <rect id="b7" x="42"  y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;34;2" dur="2.2s" repeatCount="indefinite" begin="0.9s"/></rect>
      <rect id="b8" x="49"  y="8" width="4" height="2" fill="#B8FF1E" opacity="0.5"><animate attributeName="height" values="2;18;2" dur="1.6s" repeatCount="indefinite" begin="1.05s"/></rect>
      <rect id="b9" x="56"  y="8" width="4" height="2" fill="#00E5FF" opacity="0.45"><animate attributeName="height" values="2;40;2" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></rect>
      <rect id="b10" x="63" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;24;2" dur="1.9s" repeatCount="indefinite" begin="1.35s"/></rect>
      <rect id="b11" x="70" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.5"><animate attributeName="height" values="2;10;2" dur="2.2s" repeatCount="indefinite" begin="1.5s"/></rect>
      <rect id="b12" x="77" y="8" width="4" height="2" fill="#9B5CFF" opacity="0.5"><animate attributeName="height" values="2;46;2" dur="2.0s" repeatCount="indefinite" begin="1.65s"/></rect>
      <rect id="b13" x="84" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;28;2" dur="1.7s" repeatCount="indefinite" begin="1.8s"/></rect>
      <rect id="b14" x="91" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.5"><animate attributeName="height" values="2;36;2" dur="2.1s" repeatCount="indefinite" begin="1.95s"/></rect>
      <rect id="b15" x="98" y="8" width="4" height="2" fill="#00E5FF" opacity="0.5"><animate attributeName="height" values="2;20;2" dur="1.8s" repeatCount="indefinite" begin="2.1s"/></rect>
      <rect id="b16" x="105" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;14;2" dur="2.3s" repeatCount="indefinite" begin="2.25s"/></rect>
      <rect id="b17" x="112" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.5"><animate attributeName="height" values="2;42;2" dur="1.9s" repeatCount="indefinite" begin="2.4s"/></rect>
      <rect id="b18" x="119" y="8" width="4" height="2" fill="#B8FF1E" opacity="0.55"><animate attributeName="height" values="2;22;2" dur="2.0s" repeatCount="indefinite" begin="2.55s"/></rect>
    </g>
  </g>

  <!-- signal loss / reconnect overlays -->
  <g font-family="'Cascadia Code','Fira Code',Consolas,monospace">
    <text x="640" y="282" font-size="12" letter-spacing="2" fill="#FF4D00" text-anchor="end" opacity="0">SIGNAL LOST</text>
    <animate attributeName="opacity" values="0;0;1;0;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.5;0.53;0.56;0.6;0.64"/>
    <text x="640" y="282" font-size="12" letter-spacing="2" fill="#8A8A8A" text-anchor="end" opacity="0">RECONNECTING...</text>
    <animate attributeName="opacity" values="0;0;0;1;0;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.56;0.58;0.62;0.66;0.7"/>
    <text x="640" y="282" font-size="12" letter-spacing="2" fill="#00E5FF" text-anchor="end" opacity="0">SIGNAL RESTORED</text>
    <animate attributeName="opacity" values="0;0;0;1;0" dur="16s" repeatCount="indefinite" keyTimes="0;0.62;0.64;0.68;0.72"/>
  </g>

  <!-- signal strength indicator (8 lit / 2 dead) -->
  <g transform="translate(660,318)">
    <rect x="0"  y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="13" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="0.2s"/></rect>
    <rect x="26" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="0.4s"/></rect>
    <rect x="39" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="0.6s"/></rect>
    <rect x="52" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="0.8s"/></rect>
    <rect x="65" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="1.0s"/></rect>
    <rect x="78" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="1.2s"/></rect>
    <rect x="91" y="0" width="10" height="12" fill="#B8FF1E"><animate attributeName="opacity" values="0.9;0.5;0.9" dur="1.4s" repeatCount="indefinite" begin="1.4s"/></rect>
  </g>
  <rect x="754" y="318" width="10" height="12" fill="#1A1A1A"/>
  <rect x="767" y="318" width="10" height="12" fill="#1A1A1A"/>

  <!-- metadata readout bottom-left -->
  <g font-family="'Cascadia Code','Fira Code',Consolas,'Courier New',monospace" font-size="10.5" letter-spacing="1.5">
    <text x="42" y="340" fill="#8A8A8A">FREQ</text><text x="78" y="340" fill="#E8E8E8">103.7</text>
    <text x="130" y="340" fill="#8A8A8A">CHANNEL</text><text x="186" y="340" fill="#E8E8E8">PHANTOM-01</text>
    <text x="286" y="340" fill="#8A8A8A">MODE</text><text x="332" y="340" fill="#E8E8E8">BROADCAST</text>
    <text x="404" y="340" fill="#8A8A8A">SOURCE</text><text x="462" y="340" fill="#4D4D4D">UNKNOWN</text>
    <text x="524" y="340" fill="#8A8A8A">TIME</text><text x="566" y="340" fill="#4D4D4D">UTC</text>
  </g>

  <!-- decorative readout disclaimer -->
</svg>