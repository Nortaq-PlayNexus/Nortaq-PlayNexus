name: Snake Transmitter
# Renders the contribution calendar as the PHANTOMTAPE snake and recolors
# it into the broadcast signal palette every day (and on demand).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-signal-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage snake asset
        shell: bash
        run: |
          sudo chown -R runner:docker dist || true
          mkdir -p assets
          cp dist/snake-signal-dark.svg assets/snake-signal-dark.svg

      - name: Recolor into signal palette
        run: python3 scripts/recolor_snake.py assets/snake-signal-dark.svg

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "rebroadcast: signal snake refreshed"
          add: "assets/snake-signal-dark.svg"
          pull: '--rebase'