name: Snake Transmitter
# Renders the contribution calendar as the PHANTOMTAPE snake and recolors
# it into the broadcast signal palette every day (and on demand).
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-signal-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage snake asset
        shell: bash
        run: |
          sudo chown -R runner:docker dist || true
          mkdir -p assets
          cp dist/snake-signal-dark.svg assets/snake-signal-dark.svg

      - name: Recolor into signal palette
        run: python3 scripts/recolor_snake.py assets/snake-signal-dark.svg

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-signal-dark.svg
          if git diff --cached --quiet; then echo "snake unchanged"; exit 0; fi
          git commit -m "rebroadcast: signal snake refreshed"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash || true
          done