name: Rebroadcast
# The profile re-transmits itself: every night it pulls the owner's live
# public facts and rebuilds the dynamic block in README.md between the
# REBROADCAST markers, updating the SIGNAL HASH so it stays verifiable.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/rebroadcast.py"]

permissions:
  contents: write

jobs:
  rebroadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run rebroadcast
        run: python3 scripts/rebroadcast.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "transmission unchanged"; exit 0; fi
          git commit -m "rebroadcast: transmission refreshed"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash || true
          done

      - name: Show what changed
        run: git show --stat --oneline HEAD || true