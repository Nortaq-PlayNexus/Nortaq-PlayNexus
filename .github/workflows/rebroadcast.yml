name: Rebroadcast
# The profile re-transmits itself: every night it pulls the owner's live
# public facts, rebuilds the dynamic block in README.md, generates all new
# assets (constellation, genome, DNA cards, intelligence report, CRT equalizer),
# and deploys Mission Control to GitHub Pages.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/rebroadcast.py", "scripts/generate_assets.py", "scripts/crt_equalizer.py", "scripts/zenodo_sync.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebroadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CRT equalizer
        run: python3 scripts/crt_equalizer.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run rebroadcast (includes asset generation)
        run: python3 scripts/rebroadcast.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Zenodo archive table
        run: python3 scripts/zenodo_sync.py

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated/ assets/crt-equalizer.svg
          if git diff --cached --quiet; then echo "transmission unchanged"; exit 0; fi
          git commit -m "rebroadcast: transmission refreshed + assets regenerated"
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase --autostash || true
          done

      - name: Show what changed
        run: git show --stat --oneline HEAD || true

  deploy-pages:
    needs: rebroadcast
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Mission Control data
        run: python3 mission-control/scripts/collect-data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mission-control/package-lock.json

      - name: Install and build Mission Control
        working-directory: mission-control
        run: |
          npm ci
          npm run build

      - name: Assemble combined site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp -r docs/. site/
          cp -r mission-control/dist site/mission-control

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
