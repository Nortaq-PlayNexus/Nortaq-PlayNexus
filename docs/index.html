<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="2; url=mission-control/" />
  <title>PHANTOMTAPE // SIGNAL ROUTING</title>
  <style>
    :root { --bg: #0a0e1a; --green: #B8FF1E; --dim: #6A7080; --border: #1a2040; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--green);
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .panel { border: 1px solid var(--border); padding: 2.5rem 3rem; max-width: 34rem; }
    h1 { font-size: 1.1rem; letter-spacing: 0.2em; margin-bottom: 1rem; }
    p { color: var(--dim); font-size: 0.8rem; line-height: 1.8; margin-bottom: 1.4rem; }
    a {
      color: var(--green);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-decoration: none;
      border: 1px solid var(--green);
      padding: 0.6rem 1.2rem;
      display: inline-block;
    }
    a:hover { background: var(--green); color: var(--bg); }
  </style>
</head>
<body>
  <div class="panel">
    <h1>◉ SIGNAL ROUTING</h1>
    <p>
      THIS FREQUENCY RESOLVES TO MISSION CONTROL.<br />
      ROUTING AUTOMATICALLY...
    </p>
    <a href="mission-control/">[ ENTER MISSION CONTROL ]</a>
  </div>
</body>
</html>
